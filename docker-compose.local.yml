volumes:
  betterleaf_local_postgres_data: {}
  betterleaf_local_postgres_data_backups: {}
  betterleaf_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: betterleaf_local_django
    container_name: betterleaf_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: betterleaf_production_postgres
    container_name: betterleaf_local_postgres
    volumes:
      - betterleaf_local_postgres_data:/var/lib/postgresql/18/docker
      - betterleaf_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: betterleaf_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.10
    container_name: betterleaf_local_redis
    volumes:
      - betterleaf_local_redis_data:/data

  celeryworker:
    <<: *django
    image: betterleaf_local_celeryworker
    container_name: betterleaf_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: betterleaf_local_celerybeat
    container_name: betterleaf_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: betterleaf_local_flower
    container_name: betterleaf_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  latex:
    image: texlive/texlive:latest        # full scheme; pin e.g. a dated tag for reproducibility
    working_dir: /workdir
    volumes:
      - ./:/workdir
      - ./compose/local/latex-server:/latex-server:ro
    user: "${UID:-1000}:${GID:-1000}"    # output files owned by you, not root
    command: ["python3", "/latex-server/server.py"]
    ports:
      - "7030:7030"
