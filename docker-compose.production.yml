volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}

  production_redis_data: {}


services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: betterleaf_production_django
    depends_on:
      - postgres
      - redis
      - latex
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: betterleaf_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: betterleaf_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:5555:5555'

  redis:
    image: docker.io/redis:7.2
    
    volumes:
      - production_redis_data:/data
    

  celeryworker:
    <<: *django
    image: betterleaf_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: betterleaf_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: betterleaf_production_flower
    command: /start-flower

  latex:
    image: texlive/texlive:latest
    user: "1000:1000"
    environment:
      - HOME=/tmp
    volumes:
      - ./compose/local/latex-server:/latex-server:ro
    command: ["python3", "/latex-server/server.py"]
    restart: unless-stopped
